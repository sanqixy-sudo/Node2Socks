[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/domain",
  "crates/cloud-sync",
  "crates/storage",
  "crates/diagnostics",
  "crates/core-adapter",
  "crates/crypto",
  "crates/slot-manager",
  "crates/runtime-service",
  "crates/recovery",
  "crates/subscriptions",
  "services/cloud",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Proprietary"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.4"
hex = "0.4.3"
rand = "0.9.2"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream", "socks"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.0", features = ["serde", "v4"] }
