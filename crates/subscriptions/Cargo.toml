version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
base64 = "0.23.1"
futures-util = "0.3.34"
hex.workspace = true
node2socks-crypto = { version = "0.1.0", path = "../crypto" }
node2socks-domain = { version = "0.1.0", path = "../domain" }
node2socks-storage = { version = "0.1.0", path = "../storage" }
rand.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
