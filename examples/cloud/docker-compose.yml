services:
  node2socks-cloud:
    build:
      context: ../..
      dockerfile: services/cloud/Dockerfile
    container_name: node2socks-cloud
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      NODE2SOCKS_CLOUD_LISTEN: "0.0.0.0:8080"
      NODE2SOCKS_CLOUD_DATA: "/data"
      NODE2SOCKS_CLOUD_JWT_SECRET: "${NODE2SOCKS_CLOUD_JWT_SECRET:?set a random secret of at least 32 characters}"
      RUST_LOG: "info"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
