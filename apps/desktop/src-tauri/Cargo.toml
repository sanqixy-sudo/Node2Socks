[package]
name = "node2socks-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
node2socks-cloud-sync = { path = "../../../crates/cloud-sync" }
node2socks-crypto = { path = "../../../crates/crypto" }
node2socks-core-adapter = { path = "../../../crates/core-adapter" }
node2socks-runtime-service = { path = "../../../crates/runtime-service" }
node2socks-subscriptions = { path = "../../../crates/subscriptions" }
node2socks-diagnostics = { path = "../../../crates/diagnostics" }
node2socks-domain = { path = "../../../crates/domain" }
node2socks-recovery = { path = "../../../crates/recovery" }
node2socks-slot-manager = { path = "../../../crates/slot-manager" }
node2socks-storage = { path = "../../../crates/storage" }
serde_json.workspace = true
tokio.workspace = true
tokio-util = "0.7.16"
rusqlite.workspace = true
url = "2.5.8"
uuid.workspace = true
serde.workspace = true
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.4.0"
tauri = { version = "=2.8.5", features = ["tray-icon", "image-png"] }
tracing.workspace = true
tracing-subscriber.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading"] }


[dev-dependencies]
tempfile.workspace = true
